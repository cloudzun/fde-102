name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        # jieba：search 插件 lang=zh 的中文分词依赖（缺它会退化为整段不切词）
        run: pip install mkdocs-material mkdocs-callouts mkdocs-print-site-plugin jieba

      - name: Style lint（体例检查，不过则中止部署）
        run: python scripts/style-lint.py

      - name: Sync docs from textbook
        run: python scripts/build_docs.py

      - name: Build site
        run: mkdocs build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
